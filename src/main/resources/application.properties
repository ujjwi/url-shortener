# ========================
# Application Config
# ========================
spring.application.name=urlshortener

# Server port (default is 8080, same concept as Express's app.listen(PORT))
server.port=8080

# ========================
# Database (disabled for now — Sprint 1 will configure PostgreSQL)
# ========================
# JPA requires a datasource. Since we haven't set up PostgreSQL yet,
# we exclude the auto-configuration to prevent startup errors.
# We'll REMOVE these two lines in Sprint 1.
#
# NOTE: Spring Boot 4.x moved these classes to new packages:
#   3.x: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
#   4.x: org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
