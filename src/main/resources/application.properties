# ========================
# Application Config
# ========================
spring.application.name=urlshortener

# Server port (default is 8080, same concept as Express's app.listen(PORT))
server.port=8080

# ========================
# PostgreSQL Database
# ========================
# These 3 properties are the equivalent of a MongoDB/Sequelize connection string:
#   mongoose.connect("mongodb://user:pass@localhost:27017/urlshortener")
#   new Sequelize("postgres://postgres:password@localhost:5432/urlshortener")

# JDBC URL format: jdbc:postgresql://HOST:PORT/DATABASE_NAME
spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortener

# Database credentials
spring.datasource.username=postgres
spring.datasource.password=YOUR_PASSWORD_HERE

# ========================
# JPA / Hibernate Config
# ========================

# ddl-auto controls how Hibernate manages the database schema:
#   - "update"   = create tables if missing, alter if entity changed (good for dev)
#   - "create"   = DROP all tables and recreate on every startup (destructive!)
#   - "validate" = only check that tables match entities, don't modify (good for prod)
#   - "none"     = do nothing
#
# We use "update" for development — it's like Sequelize's { alter: true }
spring.jpa.hibernate.ddl-auto=update

# Show the SQL that Hibernate generates in the console.
# Useful for learning — you'll see the CREATE TABLE, INSERT, SELECT, etc.
# Turn this OFF in production.
spring.jpa.show-sql=true

# Format the SQL output so it's readable (not one giant line)
spring.jpa.properties.hibernate.format_sql=true
